services:
  - type: web
    name: mind-clash
    runtime: node
    plan: free # Free tier: $0/mo, spins down after 15 min of inactivity
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: MAX_ROOM_IDLE_MINUTES
        value: "15"
      # CLIENT_ORIGIN is automatically detected from Render's RENDER_EXTERNAL_URL
      # To specify custom domains, add comma-separated origins here:
      # - key: CLIENT_ORIGIN
      #   value: https://mind-clash.onrender.com
